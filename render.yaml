services:
  - type: web
    name: probes
    runtime: docker
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /app/data/health.db
      - key: CHECK_INTERVAL_SECONDS
        value: "60"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
