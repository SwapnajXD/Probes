apiVersion: apps/v1
kind: Deployment
metadata:
  name: probes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probes
  template:
    metadata:
      labels:
        app: probes
    spec:
      containers:
        - name: probes
          image: swapnajxd/probes:eks
          ports:
            - containerPort: 10000
          env:
            - name: PORT
              value: "10000"
          envFrom:
            - secretRef:
                name: probes-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 10000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 10000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
